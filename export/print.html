<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>手账本打印页</title>
  <style>
    body { margin: 0; background: #f6f1e7; font: 14px/1.8 "PingFang SC", sans-serif; color: #3a3632; }
    #loading { max-width: 480px; margin: 120px auto; background: #fff; border: 1px solid #e8dfd0; border-radius: 10px; padding: 28px 32px; text-align: center; }
    #loading .bar { height: 6px; background: #eee5d5; border-radius: 3px; overflow: hidden; margin-top: 12px; }
    #loading .bar i { display: block; height: 100%; width: 0%; background: #d96f57; transition: width .2s; }
  </style>
</head>
<body>
  <div id="loading">
    <b>正在准备打印页…</b>
    <div class="muted" id="loadmsg">读取本地数据</div>
    <div class="bar"><i id="loadfill"></i></div>
  </div>
  <script type="module" src="print.js"></script>
</body>
</html>
