<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9a917f"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a8c5c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="520" fill="#faf6ef"/>

  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#3a3632">weibo-journal 数据流 / Data Flow</text>

  <!-- 数据源 -->
  <rect x="30" y="60" width="180" height="92" rx="10" fill="#fff" stroke="#d8cfc0"/>
  <text x="120" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a3632">微博接口</text>
  <text x="120" y="100" text-anchor="middle" font-size="11" fill="#6b6355">weibo.com/ajax</text>
  <text x="120" y="116" text-anchor="middle" font-size="11" fill="#6b6355">(近期 · XSRF+Cookie)</text>
  <text x="120" y="132" text-anchor="middle" font-size="11" fill="#6b6355">m.weibo.cn 游标</text>
  <text x="120" y="148" text-anchor="middle" font-size="11" fill="#6b6355">(全部历史)</text>

  <!-- DNR 注解 -->
  <rect x="30" y="162" width="180" height="22" rx="11" fill="#efe9dd"/>
  <text x="120" y="177" text-anchor="middle" font-size="10" fill="#6b6355">DNR 规则：自动补 Referer 反盗链</text>

  <!-- 抓取 -->
  <rect x="250" y="60" width="200" height="92" rx="10" fill="#fff" stroke="#d8cfc0"/>
  <text x="350" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a3632">Service Worker</text>
  <text x="350" y="100" text-anchor="middle" font-size="11" fill="#6b6355">抓取状态机 · 双源合并</text>
  <text x="350" y="116" text-anchor="middle" font-size="11" fill="#6b6355">限速 1.2s · 418/432 退避</text>
  <text x="350" y="132" text-anchor="middle" font-size="11" fill="#6b6355">断点续抓 · mid 去重</text>
  <text x="350" y="148" text-anchor="middle" font-size="11" fill="#6b6355">入库前校验非空</text>

  <!-- Popup 注解 -->
  <rect x="250" y="162" width="200" height="22" rx="11" fill="#efe9dd"/>
  <text x="350" y="177" text-anchor="middle" font-size="10" fill="#6b6355">Popup 触发：原创/转发 · 图/视频/文章 勾选</text>

  <!-- 存储 -->
  <rect x="490" y="60" width="180" height="92" rx="10" fill="#fff" stroke="#d8cfc0"/>
  <text x="580" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a3632">IndexedDB（本地）</text>
  <text x="580" y="100" text-anchor="middle" font-size="11" fill="#6b6355">posts 按 mid 存储</text>
  <text x="580" y="116" text-anchor="middle" font-size="11" fill="#6b6355">media 原图/视频 blob</text>
  <text x="580" y="132" text-anchor="middle" font-size="11" fill="#6b6355">meta 断点/统计/选项</text>
  <text x="580" y="148" text-anchor="middle" font-size="11" fill="#6b6355">损坏记录可被回补修复</text>

  <!-- 导出 -->
  <rect x="710" y="60" width="220" height="92" rx="10" fill="#fff" stroke="#d8cfc0"/>
  <text x="820" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a3632">导出 Export</text>
  <text x="820" y="100" text-anchor="middle" font-size="11" fill="#6b6355">HTML 文件夹（FS Access）</text>
  <text x="820" y="116" text-anchor="middle" font-size="11" fill="#6b6355">自动下载目录 · ZIP 回退</text>
  <text x="820" y="132" text-anchor="middle" font-size="11" fill="#6b6355">打印页 → 另存为 PDF</text>
  <text x="820" y="148" text-anchor="middle" font-size="11" fill="#6b6355">媒体缺失自动回补（自愈）</text>

  <line x1="210" y1="106" x2="248" y2="106" stroke="#9a917f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="106" x2="488" y2="106" stroke="#9a917f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="670" y1="106" x2="708" y2="106" stroke="#9a917f" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 阶段流水线 -->
  <text x="480" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a3632">抓取阶段流水线 / Crawl Phases</text>
  <g font-size="11" fill="#3a3632">
    <rect x="40"  y="228" width="128" height="34" rx="17" fill="#fdeee6" stroke="#d96f57"/>
    <text x="104" y="250" text-anchor="middle">A 近期 weibo.com</text>
    <rect x="180" y="228" width="128" height="34" rx="17" fill="#fdeee6" stroke="#d96f57"/>
    <text x="244" y="250" text-anchor="middle">B 游标挖全历史</text>
    <rect x="320" y="228" width="104" height="34" rx="17" fill="#fdeee6" stroke="#d96f57"/>
    <text x="372" y="250" text-anchor="middle">长文补全</text>
    <rect x="436" y="228" width="150" height="34" rx="17" fill="#fdeee6" stroke="#d96f57"/>
    <text x="511" y="250" text-anchor="middle" font-size="10">媒体下载 原图·视频·文章</text>
    <rect x="598" y="228" width="104" height="34" rx="17" fill="#e8f0f7" stroke="#7ba2c9"/>
    <text x="650" y="250" text-anchor="middle">点赞足迹*</text>
    <rect x="714" y="228" width="104" height="34" rx="17" fill="#e8f0f7" stroke="#7ba2c9"/>
    <text x="776" y="250" text-anchor="middle">评论足迹*</text>
    <rect x="830" y="228" width="76"  height="34" rx="17" fill="#e9f3ea" stroke="#4a8c5c"/>
    <text x="868" y="250" text-anchor="middle">完成</text>
  </g>
  <text x="480" y="284" text-anchor="middle" font-size="10" fill="#9a917f">* 尽力而为：受微博接口限制，只含平台保留的最近记录 / best-effort, limited by Weibo API</text>

  <!-- 导出自愈 -->
  <text x="40" y="318" font-size="13" font-weight="bold" fill="#3a3632">导出自愈 / Self-healing Export</text>
  <g font-size="11" fill="#3a3632">
    <rect x="40" y="332" width="220" height="58" rx="10" fill="#fff" stroke="#4a8c5c"/>
    <text x="150" y="356" text-anchor="middle" font-weight="bold">导出 / 打印时逐张校验</text>
    <text x="150" y="376" text-anchor="middle" font-size="10" fill="#6b6355">blob 非空 · 类型 · 大小</text>

    <rect x="300" y="332" width="170" height="58" rx="10" fill="#fdeee6" stroke="#d96f57"/>
    <text x="385" y="356" text-anchor="middle" font-weight="bold">缺失 / 损坏？</text>
    <text x="385" y="376" text-anchor="middle" font-size="10" fill="#6b6355">空 blob 记录自动识别</text>

    <rect x="510" y="332" width="230" height="58" rx="10" fill="#fff" stroke="#4a8c5c"/>
    <text x="625" y="356" text-anchor="middle" font-weight="bold">400ms 限速实时回补</text>
    <text x="625" y="376" text-anchor="middle" font-size="10" fill="#6b6355">带登录态直连微博 CDN 重新下载</text>

    <rect x="780" y="332" width="150" height="58" rx="10" fill="#e9f3ea" stroke="#4a8c5c"/>
    <text x="855" y="356" text-anchor="middle" font-weight="bold">回写 IndexedDB</text>
    <text x="855" y="376" text-anchor="middle" font-size="10" fill="#6b6355">修复本地媒体库</text>
  </g>
  <line x1="260" y1="361" x2="298" y2="361" stroke="#4a8c5c" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="470" y1="361" x2="508" y2="361" stroke="#4a8c5c" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="740" y1="361" x2="778" y2="361" stroke="#4a8c5c" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <!-- 回写回路：回到存储 -->
  <path d="M855,332 L855,306 L580,306 L580,154" fill="none" stroke="#4a8c5c" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowGreen)"/>
  <text x="712" y="300" text-anchor="middle" font-size="10" fill="#4a8c5c">修复</text>
  <text x="480" y="414" text-anchor="middle" font-size="10" fill="#9a917f">历史遗留的缺口（旧版本静默跳过 / 空文件）一次导出即全部愈合，破图不会进入手账本 / historical gaps close in one export pass</text>

  <!-- 产物 -->
  <text x="480" y="448" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a3632">产物 / Output</text>
  <g font-size="11" fill="#6b6355">
    <rect x="60"  y="462" width="250" height="48" rx="8" fill="#fff" stroke="#d8cfc0"/>
    <text x="185" y="482" text-anchor="middle" font-weight="bold" fill="#3a3632">手账本.html（离线）</text>
    <text x="185" y="500" text-anchor="middle">时间线 · 目录 · 搜索 · 分类筛选 · 打印</text>
    <rect x="330" y="462" width="250" height="48" rx="8" fill="#fff" stroke="#d8cfc0"/>
    <text x="455" y="482" text-anchor="middle" font-weight="bold" fill="#3a3632">images/original · repost</text>
    <text x="455" y="500" text-anchor="middle">原创图与转发图分目录（年/月归档）</text>
    <rect x="600" y="462" width="300" height="48" rx="8" fill="#fff" stroke="#d8cfc0"/>
    <text x="750" y="482" text-anchor="middle" font-weight="bold" fill="#3a3632">data.json · videos · 导出报告.txt</text>
    <text x="750" y="500" text-anchor="middle">原始数据备份 · 视频 · 完整性核对清单</text>
  </g>
</svg>
